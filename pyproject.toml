[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "setuptools-scm"]

[project]
name = "emevo"
authors = [{name = "Yuji Kanagawa", email = "yuji.kanagawa@oist.jp"}]
description = "A simulation platform for Embodied Evolution of learning agents"
license = {text = "Apache2"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Typing :: Typed",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    # Jax related
    "jax >= 0.7",
    "chex >= 0.1.82",
    "equinox >= 0.13",
    "optax >= 0.1",
    "phyjax2d >= 0.3.3",
    # Other
    "pyarrow >= 9.0",
    "pyserde[toml] >= 0.14",
    "moderngl >= 5.6",
    "moderngl-window >= 2.4",
]
dynamic = ["version"]

[project.optional-dependencies]
# pygraphviz >= 1.0 is also required to draw phylogenetic tree, but excluded here for Github CI
analysis = [
    "matplotlib >= 3.0",
    "networkx >= 3.0",
    "polars >= 1.0",
    "seaborn >= 0.12",
]
# Meta feature to install CUDA12 jax
cuda12 = ["jax[cuda12]"]
widget = ["PySide6 >= 6.8"]
video = ["av >= 14.0"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
homepage = "https://github.com/oist/emevo"
bug-tracker = "https://github.com/oist/emevo/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "emevo.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/emevo/reward_fn.py" = ["B023"]
# For typer
"experiments/*.py" = ["B008", "UP006", "UP007"]
"smoke-tests/*.py" = ["B008", "UP006", "UP007"]
"scripts/*.py" = ["UP006", "UP035", "UP007"]

[dependency-groups]
dev = [
    "black >= 24.10.0",
    "bqplot >= 0.12",
    "itables >= 2.4",
    "ipykernel >= 6.29.5",
    "isort >= 5.13.2",
    "ipympl >= 0.9.4",
    "jupyterlab >= 4.0",
    "jupyterlab-code-formatter >= 3.0",
    "treescope >= 0.1",
    "pytest >= 8.3.3",
    "polars-u64-idx >= 1.0",
    "scikit-learn >= 1.6",
    "statsmodels >= 0.14",
    "typer >= 0.12",
    "tqdm >= 4.6",
]

